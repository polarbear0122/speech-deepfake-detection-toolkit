[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-deepfake-detection-toolkit"
version = "0.1.0"
description = "Open-source research utilities for speech deepfake detection and attack source analysis."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "polarbear0122"}
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "PyYAML>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
